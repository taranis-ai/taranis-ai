name: Smoke test docker compose

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      use_latest_published_images:
        description: Skip the build and smoke-test the latest published GHCR images
        type: boolean
        default: false
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  test_docker_deployment:
    timeout-minutes: 20
    if: ${{ github.event.review.state == 'approved' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      APPLICATION_SERVICES: ingress core core-background frontend collector workers cron
      SUPPORT_SERVICES: redis centrifugo database

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Docker images from PR code
        if: ${{ !inputs.use_latest_published_images }}
        run: |
          chmod +x docker/build_container.sh
          ./docker/build_container.sh

      - name: Prepare docker compose environment
        working-directory: docker
        run: cp env.sample .env

      - name: Pull latest published application images
        if: ${{ inputs.use_latest_published_images }}
        working-directory: docker
        run: |
          read -r -a application_services <<< "$APPLICATION_SERVICES"
          docker compose pull "${application_services[@]}"

      - name: Run docker compose for last commit
        working-directory: docker
        env:
          PRE_SEED_PASSWORD_USER: test
        run: |
          read -r -a application_services <<< "$APPLICATION_SERVICES"
          read -r -a support_services <<< "$SUPPORT_SERVICES"
          docker compose pull "${support_services[@]}"
          docker compose up "${application_services[@]}" "${support_services[@]}" --pull=never --wait-timeout=180 --wait

      - name: Check container status
        # Show status/logs only when a previous step failed (e.g. compose --wait)
        if: failure()
        working-directory: docker
        run: |
          echo "Container status:"
          docker compose ps
          echo ""
          echo "Container logs:"
          docker compose logs

      - name: Verify all containers are healthy
        # we could drop this step and rely on `--wait` above, but this gives more detailed output
        if: success()
        working-directory: docker
        run: |
          # Check that services with healthchecks are healthy
          for service in core core-background frontend collector workers cron database redis centrifugo; do
            HEALTH=$(docker compose ps $service --format json | jq -r '.Health')
            if [ -n "$HEALTH" ] && [ "$HEALTH" != "healthy" ]; then
              echo "❌ Service $service health check failed (health: $HEALTH)"
              docker compose ps
              docker compose logs $service
              exit 1
            fi
          done

          echo "✅ All containers are healthy and running"

      - name: Verify worker routing and interactive Core isolation
        working-directory: docker
        run: |
          for service in collector workers cron; do
            docker compose exec -T "$service" python - <<'PYTHON'
          import os
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          url = os.environ["TARANIS_CORE_URL"]
          assert urlsplit(url).hostname == "core-background"
          request = Request(f"{url}/worker/cron-jobs", headers={"Authorization": f"Bearer {os.environ['API_KEY']}"})
          with urlopen(request, timeout=10) as response:
              assert response.status == 200
          PYTHON
          done

          background_id="$(docker compose ps -q core-background)"
          docker pause "$background_id"
          trap 'docker unpause "$background_id"' EXIT
          docker compose exec -T frontend python - <<'PYTHON'
          import os
          from urllib.parse import urlsplit
          import requests

          url = os.environ["TARANIS_CORE_URL"]
          assert urlsplit(url).hostname == "core"
          login = requests.post(f"{url}/auth/login", json={"username": "user", "password": "test"}, timeout=5)
          login.raise_for_status()
          headers = {"Authorization": f"Bearer {login.json()['access_token']}"}
          stories = requests.get(f"{url}/assess/stories", headers=headers, timeout=5)
          stories.raise_for_status()
          assert isinstance(stories.json()["items"], list)
          PYTHON

      - name: Show compose logs after e2e failure
        if: failure()
        working-directory: docker
        run: |
          echo "Container status:"
          docker compose ps
          echo ""
          echo "Container logs:"
          docker compose logs

      - name: Cleanup
        if: always()
        working-directory: docker
        run: docker compose down
