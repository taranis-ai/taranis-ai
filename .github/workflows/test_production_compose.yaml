name: Smoke test docker compose
on:
  workflow_dispatch:
    inputs:
      use_latest_published_images:
        description: Skip the build and smoke-test the latest published GHCR images
        type: boolean
        default: false
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  test_docker_deployment:
    if: ${{ github.event.review.state == 'approved' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      APPLICATION_SERVICES: ingress core frontend collector workers cron
      SUPPORT_SERVICES: redis sse database

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker images from PR code
        if: ${{ !inputs.use_latest_published_images }}
        run: |
          chmod +x docker/build_container.sh
          ./docker/build_container.sh

      - name: Prepare docker compose environment
        working-directory: docker
        run: cp env.sample .env

      - name: Pull latest published application images
        if: ${{ inputs.use_latest_published_images }}
        working-directory: docker
        run: docker compose pull $APPLICATION_SERVICES

      - name: Run docker compose for last commit
        working-directory: docker
        env:
          PRE_SEED_PASSWORD_USER: test
        run: |
          docker compose pull $SUPPORT_SERVICES
          docker compose up $APPLICATION_SERVICES $SUPPORT_SERVICES --pull=never --wait-timeout=180 --wait

      - name: Check container status
        # Show status/logs only when a previous step failed (e.g. compose --wait)
        if: failure()
        working-directory: docker
        run: |
          echo "Container status:"
          docker compose ps
          echo ""
          echo "Container logs:"
          docker compose logs

      - name: Verify all containers are healthy
        # we could drop this step and rely on `--wait` above, but this gives more detailed output
        if: success()
        working-directory: docker
        run: |
          # Check that services with healthchecks are healthy
          for service in core frontend collector workers cron database redis; do
            HEALTH=$(docker compose ps $service --format json | jq -r '.Health')
            if [ -n "$HEALTH" ] && [ "$HEALTH" != "healthy" ]; then
              echo "❌ Service $service health check failed (health: $HEALTH)"
              docker compose ps
              docker compose logs $service
              exit 1
            fi
          done

          echo "✅ All containers are healthy and running"

      - name: Show compose logs after e2e failure
        if: failure()
        working-directory: docker
        run: |
          echo "Container status:"
          docker compose ps
          echo ""
          echo "Container logs:"
          docker compose logs

      - name: Cleanup
        if: always()
        working-directory: docker
        run: docker compose down
