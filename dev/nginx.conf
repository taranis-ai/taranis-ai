upstream coreupstream {
  server 127.0.0.1:5001;
}

upstream realtimeupstream {
  server 127.0.0.1:8088;
}

upstream frontendupstream {
  server 127.0.0.1:5002;
}

server {
    listen       80;
    server_name  local.taranis.ai;

    client_max_body_size 50m;

    location / {
        proxy_pass http://frontendupstream;
    }

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/internal/realtime/connect {
        return 404;
    }

    location /api {
        proxy_pass http://coreupstream;
        proxy_redirect off;
    }

    location /reports {
        proxy_pass http://coreupstream;
        proxy_redirect off;
    }

    location = /sse {
        proxy_pass http://realtimeupstream/connection/uni_sse;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        add_header Cache-Control "no-cache";
        add_header X-Accel-Buffering "no";
    }
}
