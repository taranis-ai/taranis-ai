services:
  ingress:
    build:
      context: ..
      dockerfile: docker/Containerfile.ingress
    ports:
      - "${TARANIS_PORT}:8080"
  core:
    build:
      context: ..
      dockerfile: docker/Containerfile.core
    healthcheck:
      test: ["CMD", "taranis-core-healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    extra_hosts:
      - "alpha.local.taranis.ai:host-gateway"
      - "bravo.local.taranis.ai:host-gateway"
      - "charlie.local.taranis.ai:host-gateway"
  frontend:
    build:
      context: ..
      dockerfile: docker/Containerfile.frontend
  workers:
    build:
      context: ..
      dockerfile: docker/Containerfile.worker
  llm-bot:
    profiles: ["unused"]
  collector:
    depends_on:
      core:
        condition: service_healthy
  centrifugo:
    environment:
      CENTRIFUGO_WEBSOCKET_DISABLED: "false"
