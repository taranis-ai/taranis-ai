map $http_upgrade $connection_upgrade { default upgrade; '' close; }
upstream collab_alpha { server 127.0.0.1:8081; }
upstream collab_bravo { server 127.0.0.1:8082; }
upstream collab_charlie { server 127.0.0.1:8083; }

server { listen 80; server_name alpha.local.taranis.ai;
  location / { proxy_pass http://collab_alpha; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 24h; }
}
server { listen 80; server_name bravo.local.taranis.ai;
  location / { proxy_pass http://collab_bravo; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 24h; }
}
server { listen 80; server_name charlie.local.taranis.ai;
  location / { proxy_pass http://collab_charlie; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 24h; }
}
