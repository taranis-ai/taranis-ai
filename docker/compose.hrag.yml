# Opt-in overlay: docker compose -f docker/compose.yml -f docker/compose.hrag.yml up -d
services:
  database:
    image: pgvector/pgvector:0.8.7-pg18-trixie
  neo4j:
    image: neo4j:2026.10.2-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${HRAG_NEO4J_PASSWORD:?Set HRAG_NEO4J_PASSWORD}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
  core:
    environment:
      HRAG_ENABLED: "true"
      HRAG_NEO4J_URI: bolt://neo4j:7687
      HRAG_NEO4J_PASSWORD: "${HRAG_NEO4J_PASSWORD}"
      HRAG_EMBEDDING_DIMENSIONS: "${HRAG_EMBEDDING_DIMENSIONS:-1536}"
      HRAG_EXTRACTION_LIMIT: "${HRAG_EXTRACTION_LIMIT:-20000}"
      HRAG_EMBEDDING_LIMIT: "${HRAG_EMBEDDING_LIMIT:-4000}"
    depends_on:
      neo4j:
        condition: service_healthy
  frontend:
    environment:
      HRAG_ENABLED: "true"
volumes:
  neo4j_data:
