# Docker Compose 2.24.4+; the existing external proxy terminates TLS.
services:
  ingress:
    ports: !override
      - "127.0.0.1:${TARANIS_PORT:-8080}:8080"
    environment:
      VIRTUAL_HOST: "${VIRTUAL_HOST:?Set VIRTUAL_HOST to the public DNS name}"
      VIRTUAL_PORT: "8080"
      TARANIS_TRUST_FORWARDED_PROTO: "true"

  frontend:
    environment:
      TARANIS_PUBLIC_HOST: "${VIRTUAL_HOST:?Set VIRTUAL_HOST to the public DNS name}"
      TARANIS_TRUST_FORWARDED_PROTO: "true"
