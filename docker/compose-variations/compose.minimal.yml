services:
  ingress:
    # This is the entrypoint for all requests
    ports:
    - "${TARANIS_PORT:-8080}:8080"
    depends_on:
      - core
    deploy:
      restart_policy:
        condition: always
    image: "${DOCKER_IMAGE_NAMESPACE}/taranis-ingress:${TARANIS_TAG:-latest}"
    environment:
      NGINX_WORKERS: "4"
      NGINX_CONNECTIONS: "16"
      TARANIS_CORE_UPSTREAM: "${TARANIS_CORE_UPSTREAM:-core:8080}"
      TARANIS_REALTIME_UPSTREAM: "${TARANIS_REALTIME_UPSTREAM:-centrifugo:8000}"
      TARANIS_FRONTEND_UPSTREAM: "${TARANIS_FRONTEND_UPSTREAM:-frontend:8080}"
      TARANIS_BASE_PATH: "${TARANIS_BASE_PATH:-/}"
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/curl --fail http://localhost:8080"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  core:
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: always
    image: "${DOCKER_IMAGE_NAMESPACE}/taranis-core:${TARANIS_TAG:-latest}"
    # ports:
    #   - "${TARANIS_CORE_PORT:-8081}:${TARANIS_CORE_LISTEN_PORT:-8080}"
    environment:
      DB_URL: "${DB_URL:-database}"
      DB_DATABASE: "${DB_DATABASE:-taranis}"
      DB_USER: "${DB_USER:-taranis}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-taranis}"
      TARANIS_AUTHENTICATOR: "${TARANIS_AUTHENTICATOR:-database}"
      APPLICATION_ROOT: "${TARANIS_BASE_PATH:-/}"

      REDIS_URL: "redis://redis:6379/0"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-supersecret}"

      GRANIAN_PORT: "${TARANIS_CORE_LISTEN_PORT:-8080}"
      GRANIAN_HOST: "${GRANIAN_HOST:-0.0.0.0}"
      TARANIS_CORE_SENTRY_DSN: "${TARANIS_CORE_SENTRY_DSN:-}"

      PRE_SEED_PASSWORD_ADMIN: "${PRE_SEED_PASSWORD_ADMIN:-admin}"
      PRE_SEED_PASSWORD_USER: "${PRE_SEED_PASSWORD_USER:-user}"
      SKIP_INITIAL_USER_ONBOARDING: "${SKIP_INITIAL_USER_ONBOARDING:-False}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      JWT_COOKIE_SUFFIX: "${JWT_COOKIE_SUFFIX:-}"
      API_KEY: "${API_KEY}"
      REALTIME_ENABLED: "${REALTIME_ENABLED:-true}"
      CENTRIFUGO_API_URL: "${CENTRIFUGO_API_URL:-http://centrifugo:9000}"
      CENTRIFUGO_API_KEY: "${CENTRIFUGO_API_KEY}"
      CENTRIFUGO_CONNECT_PROXY_SECRET: "${CENTRIFUGO_CONNECT_PROXY_SECRET}"
      CENTRIFUGO_ALLOWED_ORIGINS: "${CENTRIFUGO_ALLOWED_ORIGINS:-http://localhost:8080}"
      DEBUG: "${DEBUG:-False}"
    volumes:
      - "core_data:/app/data"
    healthcheck:
      test: ["CMD", "taranis-core-healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 3s
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  database:
    image: "docker.io/library/postgres:${POSTGRES_TAG:-17-alpine}"
    shm_size: 256mb
    # ports:
    # - 6543:5432
    deploy:
      restart_policy:
        condition: always
    environment:
      POSTGRES_DB: "${DB_DATABASE:-taranis}"
      POSTGRES_USER: "${DB_USER:-taranis}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-taranis}"
    command: ["postgres", "-c", "shared_buffers=${DB_SHARED_BUFFERS:-64MB}", "-c", "max_connections=${DB_MAX_CONNECTIONS:-1000}"]
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      start_period: 10s
      timeout: 3s
      retries: 3
    volumes:
      - "database_data:/var/lib/postgresql/data"
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"


  frontend:
    deploy:
      restart_policy:
        condition: always
    # ports:
    #   - "8080:8080"
    image: "${DOCKER_IMAGE_NAMESPACE}/taranis-frontend:${TARANIS_TAG:-latest}"
    environment:
      TARANIS_CORE_URL: "${TARANIS_CORE_URL:-http://core:8080/api}"
      APPLICATION_ROOT: "${TARANIS_BASE_PATH:-/}frontend"
      TARANIS_BASE_PATH: "${TARANIS_BASE_PATH:-/}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      JWT_COOKIE_SUFFIX: "${JWT_COOKIE_SUFFIX:-}"
      REALTIME_ENABLED: "${REALTIME_ENABLED:-true}"
      DEBUG: "${DEBUG:-False}"
    healthcheck:
      test: ["CMD", "taranis-frontend-healthcheck"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  workers:
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: always
    image: "${DOCKER_IMAGE_NAMESPACE}/taranis-worker:${TARANIS_TAG:-latest}"
    environment:
      TARANIS_CORE_URL: "${TARANIS_CORE_URL:-http://core:8080/api}"
      API_KEY: "${API_KEY}"
      BOT_API_KEY: "${BOT_API_KEY}"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      WORKER_TYPES: '["Collectors", "Presenters", "Publishers", "Bots", "Connectors"]'
      DEBUG: "${DEBUG:-False}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; r = redis.Redis(host='redis', port=6379, decode_responses=True); r.ping()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"


  redis:
    image: "redis:7-alpine"
    deploy:
      restart_policy:
        condition: always
    command: |
      sh -c '
        mkdir -p /data
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          redis-server --appendonly yes
        fi
      '
    volumes:
      - redis_data:/data
    environment:
      - "REDIS_PASSWORD=${REDIS_PASSWORD:-}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      start_period: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  centrifugo:
    image: "centrifugo/centrifugo:v6.9.1"
    deploy:
      restart_policy:
        condition: always
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
      - "9000"
    environment:
      CENTRIFUGO_HTTP_API_KEY: "${CENTRIFUGO_API_KEY}"
      CENTRIFUGO_HTTP_SERVER_INTERNAL_PORT: "9000"
      CENTRIFUGO_ENGINE_TYPE: "redis"
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: "${CENTRIFUGO_REDIS_URL:-redis://redis:6379/0}"
      CENTRIFUGO_ENGINE_REDIS_PREFIX: "taranis:realtime"
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "${CENTRIFUGO_ALLOWED_ORIGINS:-http://localhost:8080}"
      CENTRIFUGO_CLIENT_PROXY_CONNECT_ENABLED: "true"
      CENTRIFUGO_CLIENT_PROXY_CONNECT_ENDPOINT: "http://core:8080${TARANIS_BASE_PATH:-/}api/realtime/connect"
      CENTRIFUGO_CLIENT_PROXY_CONNECT_HTTP_HEADERS: "Cookie"
      CENTRIFUGO_CLIENT_PROXY_CONNECT_HTTP_STATIC_HEADERS: "{\"X-Realtime-Proxy-Key\":\"${CENTRIFUGO_CONNECT_PROXY_SECRET}\"}"
      CENTRIFUGO_CHANNEL_PUBLICATION_DATA_FORMAT: "json_object"
      CENTRIFUGO_CHANNEL_NAMESPACES: '[{"name":"global","presence":true},{"name":"org"},{"name":"user","allow_user_limited_channels":true}]'
      CENTRIFUGO_WEBSOCKET_DISABLED: "true"
      CENTRIFUGO_UNI_SSE_ENABLED: "true"
      CENTRIFUGO_HEALTH_ENABLED: "true"
      CENTRIFUGO_PROMETHEUS_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"


volumes:
  database_data:
  core_data:
  redis_data:
