global:
  imagePullPolicy: Always

config:
  debug: "false"
  granianHost: CHANGE_ME_BIND_HOST
  granianPort: "8080"
  taranisBasePath: /
  jwtCookieSuffix: ""
  realtimeEnabled: "true"
  centrifugoApiUrl: http://centrifugo:9000
  centrifugoAllowedOrigins: https://CHANGE_ME_INGRESS_HOSTNAME
  taranisPort: "8080"
  requestsTimeout: "600"
  disableHttp3: "false"
  sqlalchemyPoolTimeout: "3600"
  sqlalchemyPoolRecycle: "3600"
  authenticator: database
  defaultLlmEndpoint: '{"name":"Bundled inference","base_url":"http://llm-inference:8000/v1","model":"unsloth/gemma-4-E4B-it-GGUF","api_format":"chat_completions","timeout":120}'
  preSeedSettings: "{}"
  nlpApiEndpoint: ""
  sentimentAnalysisApiEndpoint: ""
  cybersecClassifierApiEndpoint: ""
  cacheDefaultTimeout: "1"
  chatEnabled: "false"

secrets:
  jwtSecretKey: CHANGE_ME_LONG_RANDOM_JWT_SECRET
  apiKey: CHANGE_ME_CORE_API_KEY
  centrifugoApiKey: CHANGE_ME_CENTRIFUGO_API_KEY
  centrifugoConnectProxySecret: CHANGE_ME_CENTRIFUGO_CONNECT_PROXY_SECRET
  botApiKey: CHANGE_ME_BOT_API_KEY
  preSeedPasswordAdmin: CHANGE_ME_ADMIN_PASSWORD
  preSeedPasswordUser: CHANGE_ME_DEFAULT_USER_PASSWORD

database:
  host: CHANGE_ME_DATABASE_HOSTNAME
  name: CHANGE_ME_DATABASE_NAME
  user: CHANGE_ME_DATABASE_USER
  password: CHANGE_ME_DATABASE_PASSWORD

redis:
  url: redis://CHANGE_ME_REDIS_HOSTNAME:6379/0
  realtimeUrl: redis://:CHANGE_ME_REDIS_PASSWORD@CHANGE_ME_REDIS_HOSTNAME:6379/0
  password: CHANGE_ME_REDIS_PASSWORD

storage:
  core:
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClassName: local-path

ingress:
  enabled: true
  className: traefik
  host: CHANGE_ME_INGRESS_HOSTNAME
  path: /
  annotations: {}
  tls: []
  # Example TLS configuration:
  # tls:
  #   - secretName: taranis-tls
  #     hosts:
  #       - taranis.example.com

networkPolicies:
  enabled: true
  ingressNamespace: kube-system
  ingressPodSelector:
    app.kubernetes.io/name: traefik
  monitoringNamespace: monitoring

images:
  core:
    repository: ghcr.io/taranis-ai/taranis-core
    tag: latest
  frontend:
    repository: ghcr.io/taranis-ai/taranis-frontend
    tag: latest
  centrifugo:
    repository: centrifugo/centrifugo
    tag: v6.9
  ingress:
    repository: ghcr.io/taranis-ai/taranis-ingress
    tag: latest
  worker:
    repository: ghcr.io/taranis-ai/taranis-worker
    tag: latest
  llmInference:
    repository: ghcr.io/taranis-ai/gemma4-e4b-gguf
    tag: cpu

replicas:
  core: 1
  frontend: 1
  centrifugo: 1
  ingress: 1
  collector: 1
  worker: 1
  cron: 1
  llmInference: 1

resources:
  core:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: "2"
      memory: 1Gi
  frontend:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "1"
      memory: 512Mi
  centrifugo:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 50m
      memory: 128Mi
  ingress:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "1"
      memory: 512Mi
  collector:
    limits:
      cpu: "2"
      memory: 6Gi
    requests:
      cpu: 100m
      memory: 256Mi
  worker:
    limits:
      cpu: "4"
      memory: 6Gi
    requests:
      cpu: "1"
      memory: 512Mi
  cron:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  llmInference:
    limits:
      cpu: "4"
      memory: 12Gi
    requests:
      cpu: 500m
      memory: 6Gi
