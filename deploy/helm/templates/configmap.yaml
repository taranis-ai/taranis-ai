apiVersion: v1
kind: ConfigMap
metadata:
  name: taranis-config
  labels:
    {{- include "taranis.labels" . | nindent 4 }}
data:
  DEBUG: {{ .Values.config.debug | quote }}
  GRANIAN_HOST: {{ .Values.config.granianHost | quote }}
  GRANIAN_PORT: {{ .Values.config.granianPort | quote }}
  TARANIS_BASE_PATH: {{ .Values.config.taranisBasePath | quote }}
  JWT_COOKIE_SUFFIX: {{ .Values.config.jwtCookieSuffix | quote }}
  REALTIME_ENABLED: {{ .Values.config.realtimeEnabled | quote }}
  CENTRIFUGO_API_URL: {{ .Values.config.centrifugoApiUrl | quote }}
  CENTRIFUGO_ALLOWED_ORIGINS: {{ .Values.config.centrifugoAllowedOrigins | quote }}
  TARANIS_PORT: {{ .Values.config.taranisPort | quote }}
  REQUESTS_TIMEOUT: {{ .Values.config.requestsTimeout | quote }}
  DISABLE_HTTP3: {{ .Values.config.disableHttp3 | quote }}
  SQLALCHEMY_POOL_TIMEOUT: {{ .Values.config.sqlalchemyPoolTimeout | quote }}
  SQLALCHEMY_POOL_RECYCLE: {{ .Values.config.sqlalchemyPoolRecycle | quote }}
  TARANIS_AUTHENTICATOR: {{ .Values.config.authenticator | quote }}
  SKIP_INITIAL_USER_ONBOARDING: {{ .Values.config.skipInitialUserOnboarding | quote }}
  SUMMARY_API_ENDPOINT: {{ .Values.config.summaryApiEndpoint | quote }}
  TITLE_API_ENDPOINT: {{ .Values.config.titleApiEndpoint | quote }}
  NLP_API_ENDPOINT: {{ .Values.config.nlpApiEndpoint | quote }}
  STORY_API_ENDPOINT: {{ .Values.config.storyApiEndpoint | quote }}
  SENTIMENT_ANALYSIS_API_ENDPOINT: {{ .Values.config.sentimentAnalysisApiEndpoint | quote }}
  CYBERSEC_CLASSIFIER_API_ENDPOINT: {{ .Values.config.cybersecClassifierApiEndpoint | quote }}
  LLM_BASE_URL: {{ .Values.config.llmBaseUrl | quote }}
  LLM_MODEL: {{ .Values.config.llmModel | quote }}
  LLM_TIMEOUT: {{ .Values.config.llmTimeout | quote }}
  CACHE_DEFAULT_TIMEOUT: {{ .Values.config.cacheDefaultTimeout | quote }}
  CHAT_ENABLED: {{ .Values.config.chatEnabled | quote }}
  CHAT_LLM_BASE_URL: {{ .Values.config.chatLlmBaseUrl | quote }}
  CHAT_LLM_MODEL: {{ .Values.config.chatLlmModel | quote }}
  CHAT_LLM_TIMEOUT: {{ .Values.config.chatLlmTimeout | quote }}
  CHAT_MAX_STORIES: {{ .Values.config.chatMaxStories | quote }}
  CHAT_REQUEST_TIMEOUT: {{ .Values.config.chatRequestTimeout | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: centrifugo-env
  labels:
    {{- include "taranis.labels" . | nindent 4 }}
data:
  CENTRIFUGO_HTTP_SERVER_INTERNAL_PORT: "9000"
  CENTRIFUGO_ENGINE_TYPE: redis
  CENTRIFUGO_ENGINE_REDIS_PREFIX: taranis:realtime
  CENTRIFUGO_CLIENT_PROXY_CONNECT_ENABLED: "true"
  CENTRIFUGO_CLIENT_PROXY_CONNECT_ENDPOINT: "http://core:8080{{ .Values.config.taranisBasePath }}api/realtime/connect"
  CENTRIFUGO_CLIENT_PROXY_CONNECT_HTTP_HEADERS: Cookie
  CENTRIFUGO_CHANNEL_PUBLICATION_DATA_FORMAT: json_object
  CENTRIFUGO_CHANNEL_NAMESPACES: '[{"name":"global","presence":true},{"name":"org"},{"name":"user","allow_user_limited_channels":true}]'
  CENTRIFUGO_WEBSOCKET_DISABLED: "true"
  CENTRIFUGO_UNI_SSE_ENABLED: "true"
  CENTRIFUGO_HEALTH_ENABLED: "true"
  CENTRIFUGO_PROMETHEUS_ENABLED: "true"
