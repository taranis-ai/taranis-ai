apiVersion: apps/v1
kind: Deployment
metadata:
  name: cron
  labels:
    {{- include "taranis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.cron }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cron
  template:
    metadata:
      labels:
        app: cron
    spec:
      restartPolicy: Always
      containers:
        - name: cron
          image: {{ include "taranis.image" .Values.images.worker | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - taranis-cron
          envFrom:
            - configMapRef:
                name: taranis-config
            - secretRef:
                name: taranis-redis-credentials
          env:
            - name: TARANIS_CORE_URL
              value: http://core:8080/api
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: taranis-secrets
                  key: API_KEY
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - python -c "import os, redis; r = redis.from_url(os.getenv('REDIS_URL', 'redis://redis:6379/0'), password=os.getenv('REDIS_PASSWORD') or None); r.get('rq:cron:leader') is not None or exit(1)"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - python -c "import os, redis; r = redis.from_url(os.getenv('REDIS_URL', 'redis://redis:6379/0'), password=os.getenv('REDIS_PASSWORD') or None); r.get('rq:cron:leader') is not None or exit(1)"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.resources.cron | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp-bot
  labels:
    {{- include "taranis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.nlp }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nlp-bot
  template:
    metadata:
      labels:
        app: nlp-bot
    spec:
      restartPolicy: Always
      containers:
        - name: nlp-bot
          image: {{ include "taranis.image" .Values.images.nlp | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: taranis-config
                  key: DEBUG
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: taranis-secrets
                  key: BOT_API_KEY
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: GRANIAN_BLOCKING_THREADS
              value: "1"
            - name: GRANIAN_INTERFACE
              value: "asgi"
            - name: GRANIAN_WORKERS
              value: "2"
            - name: GRANIAN_WORKERS_MAX_RSS
              value: "5500"
            - name: HF_HOME
              value: /app/.cache/huggingface
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources.nlp | nindent 12 }}
---
