apiVersion: apps/v1
kind: Deployment
metadata:
  name: centrifugo
  labels:
    {{- include "taranis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.centrifugo }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: centrifugo
  template:
    metadata:
      labels:
        app: centrifugo
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 45
      containers:
        - name: centrifugo
          image: {{ include "taranis.image" .Values.images.centrifugo | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: centrifugo-env
          env:
            - name: CENTRIFUGO_HTTP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: centrifugo-secrets
                  key: CENTRIFUGO_API_KEY
            - name: CENTRIFUGO_CONNECT_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: centrifugo-secrets
                  key: CENTRIFUGO_CONNECT_PROXY_SECRET
            - name: CENTRIFUGO_ENGINE_REDIS_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: taranis-redis-credentials
                  key: CENTRIFUGO_REDIS_URL
            - name: CENTRIFUGO_CLIENT_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: taranis-config
                  key: CENTRIFUGO_ALLOWED_ORIGINS
            - name: CENTRIFUGO_CLIENT_PROXY_CONNECT_HTTP_STATIC_HEADERS
              value: '{"X-Realtime-Proxy-Key":"$(CENTRIFUGO_CONNECT_PROXY_SECRET)"}'
          ports:
            - containerPort: 8000
              name: client
            - containerPort: 9000
              name: internal
          readinessProbe:
            httpGet:
              path: /health
              port: internal
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: internal
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources.centrifugo | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress
  labels:
    {{- include "taranis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.ingress }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ingress
  template:
    metadata:
      labels:
        app: ingress
        taranis.io/expose: "true"
    spec:
      restartPolicy: Always
      containers:
        - name: ingress
          image: {{ include "taranis.image" .Values.images.ingress | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: NGINX_WORKERS
              value: "4"
            - name: NGINX_CONNECTIONS
              value: "16"
            - name: TARANIS_CORE_UPSTREAM
              value: core:8080
            - name: TARANIS_REALTIME_UPSTREAM
              value: centrifugo:8000
            - name: TARANIS_FRONTEND_UPSTREAM
              value: frontend:8080
            - name: TARANIS_BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: taranis-config
                  key: TARANIS_BASE_PATH
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml .Values.resources.ingress | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  labels:
    {{- include "taranis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.collector }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      restartPolicy: Always
      containers:
        - name: collector
          image: {{ include "taranis.image" .Values.images.worker | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: taranis-config
            - secretRef:
                name: taranis-redis-credentials
          env:
            - name: TARANIS_CORE_URL
              value: http://core:8080/api
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: taranis-secrets
                  key: API_KEY
            - name: WORKER_TYPES
              value: '["Collectors"]'
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - python -c "import os, redis; redis.from_url(os.getenv('REDIS_URL', 'redis://redis:6379/0'), password=os.getenv('REDIS_PASSWORD') or None).ping()"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - python -c "import os, redis; redis.from_url(os.getenv('REDIS_URL', 'redis://redis:6379/0'), password=os.getenv('REDIS_PASSWORD') or None).ping()"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.resources.collector | nindent 12 }}
---
