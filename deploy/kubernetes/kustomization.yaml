apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-config.yaml
  - 01-secrets.yaml
  - 05-network-policies.yaml
  - 10-storage.yaml
  - 20-services-core.yaml
  - 25-service-inference.yaml
  - 30-deployments-core.yaml
  - 35-deployment-inference.yaml
  - 40-ingress.yaml
replacements:
  - source:
      kind: Ingress
      name: taranis
      fieldPath: spec.rules.0.host
    targets:
      - select:
          kind: ConfigMap
          name: taranis-config
        fieldPaths:
          - data.TRUSTED_HOSTS
