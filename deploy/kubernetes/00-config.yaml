apiVersion: v1
kind: ConfigMap
metadata:
  name: taranis-config
data:
  DEBUG: "false"
  GRANIAN_HOST: CHANGE_ME_BIND_HOST
  GRANIAN_PORT: "8080"
  TARANIS_BASE_PATH: /
  JWT_COOKIE_SUFFIX: ""
  REALTIME_ENABLED: "true"
  CENTRIFUGO_API_URL: http://centrifugo:9000
  CENTRIFUGO_ALLOWED_ORIGINS: https://CHANGE_ME_INGRESS_HOSTNAME
  TARANIS_PORT: "8080"
  REQUESTS_TIMEOUT: "600"
  DISABLE_HTTP3: "false"
  SQLALCHEMY_POOL_TIMEOUT: "3600"
  SQLALCHEMY_POOL_RECYCLE: "3600"
  TARANIS_AUTHENTICATOR: database
  SKIP_INITIAL_USER_ONBOARDING: "false"
  SUMMARY_API_ENDPOINT: http://llm-bot:8000/summarize
  TITLE_API_ENDPOINT: http://llm-bot:8000/title
  NLP_API_ENDPOINT: http://llm-bot:8000/ner
  STORY_API_ENDPOINT: http://llm-bot:8000/cluster
  SENTIMENT_ANALYSIS_API_ENDPOINT: http://llm-bot:8000/sentiment
  CYBERSEC_CLASSIFIER_API_ENDPOINT: http://llm-bot:8000/cybersec-classification
  LLM_BASE_URL: CHANGE_ME_LLM_BASE_URL
  LLM_TIMEOUT: "120"
  CACHE_DEFAULT_TIMEOUT: "1"
  CHAT_ENABLED: "false"
  CHAT_LLM_BASE_URL: ""
  CHAT_LLM_MODEL: ""
  CHAT_LLM_TIMEOUT: "120"
  CHAT_MAX_STORIES: "5"
  CHAT_REQUEST_TIMEOUT: "300"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: centrifugo-env
data:
  CENTRIFUGO_HTTP_SERVER_INTERNAL_PORT: "9000"
  CENTRIFUGO_ENGINE_TYPE: redis
  CENTRIFUGO_ENGINE_REDIS_PREFIX: taranis:realtime
  CENTRIFUGO_CLIENT_PROXY_CONNECT_ENABLED: "true"
  CENTRIFUGO_CLIENT_PROXY_CONNECT_ENDPOINT: http://core:8080/api/realtime/connect
  CENTRIFUGO_CLIENT_PROXY_CONNECT_HTTP_HEADERS: Cookie
  CENTRIFUGO_CHANNEL_PUBLICATION_DATA_FORMAT: json_object
  CENTRIFUGO_CHANNEL_NAMESPACES: '[{"name":"global","presence":true},{"name":"org"},{"name":"user","allow_user_limited_channels":true}]'
  CENTRIFUGO_WEBSOCKET_DISABLED: "true"
  CENTRIFUGO_UNI_SSE_ENABLED: "true"
  CENTRIFUGO_HEALTH_ENABLED: "true"
  CENTRIFUGO_PROMETHEUS_ENABLED: "true"
