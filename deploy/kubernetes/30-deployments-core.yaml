metadata:
  name: cron
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cron
  template:
    metadata:
      labels:
        app: cron
    spec:
      restartPolicy: Always
      containers:
        - name: cron
          image: ghcr.io/taranis-ai/taranis-worker:latest
          imagePullPolicy: Always
          command:
            - taranis-cron
          envFrom:
            - configMapRef:
                name: taranis-config
            - secretRef:
                name: taranis-redis-credentials
          env:
            - name: TARANIS_CORE_URL
              value: http://core:8080/api
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: taranis-secrets
                  key: API_KEY
          readinessProbe:
            exec:
              command:
                - taranis-worker-healthcheck
                - --mode
                - cron
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - taranis-worker-healthcheck
                - --mode
                - cron
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
