apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: core
  template:
    metadata:
      labels:
        app: core
        taranis.io/expose: "true"
    spec:
      restartPolicy: Always
      containers:
        - name: core
          image: ghcr.io/taranis-ai/taranis-core:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: taranis-config
            - secretRef:
                name: db-credentials
            - secretRef:
                name: taranis-redis-credentials
          env:
            - name: APPLICATION_ROOT
              valueFrom:
                configMapKeyRef:
                  name: taranis-config
                  key: TARANIS_BASE_PATH
                  optional: true
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: taranis-secrets
                  key: JWT_SECRET_KEY
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: taranis-secrets
                  key: API_KEY
            - name: CENTRIFUGO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: centrifugo-secrets
                  key: CENTRIFUGO_API_KEY
            - name: CENTRIFUGO_CONNECT_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: centrifugo-secrets
                  key: CENTRIFUGO_CONNECT_PROXY_SECRET
            - name: BOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: taranis-secrets
                  key: BOT_API_KEY
                  optional: true
            - name: PRE_SEED_PASSWORD_ADMIN
              valueFrom:
                secretKeyRef:
                  name: taranis-secrets
                  key: PRE_SEED_PASSWORD_ADMIN
            - name: PRE_SEED_PASSWORD_USER
              valueFrom:
                secretKeyRef:
                  name: taranis-secrets
                  key: PRE_SEED_PASSWORD_USER
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            exec:
              command:
                - taranis-core-healthcheck
            initialDelaySeconds: 15
            periodSeconds: 300
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - taranis-core-healthcheck
            initialDelaySeconds: 15
            periodSeconds: 300
            timeoutSeconds: 10
          volumeMounts:
            - name: core
              mountPath: /app/data
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: core
          persistentVolumeClaim:
            claimName: core
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      restartPolicy: Always
      containers:
        - name: frontend
          image: ghcr.io/taranis-ai/taranis-frontend:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: taranis-config
            - secretRef:
                name: taranis-redis-credentials
          env:
            - name: TARANIS_CORE_URL
              value: http://core:8080/api
            - name: APPLICATION_ROOT
              value: "$(TARANIS_BASE_PATH)frontend"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: taranis-secrets
                  key: JWT_SECRET_KEY
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            exec:
              command:
                - taranis-frontend-healthcheck
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - taranis-frontend-healthcheck
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: "1"
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: centrifugo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: centrifugo
  template:
    metadata:
      labels:
        app: centrifugo
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 45
      containers:
        - name: centrifugo
          image: centrifugo/centrifugo:v6.9.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: centrifugo-env
          env:
            - name: CENTRIFUGO_HTTP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: centrifugo-secrets
                  key: CENTRIFUGO_API_KEY
            - name: CENTRIFUGO_CONNECT_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: centrifugo-secrets
                  key: CENTRIFUGO_CONNECT_PROXY_SECRET
            - name: CENTRIFUGO_ENGINE_REDIS_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: taranis-redis-credentials
                  key: CENTRIFUGO_REDIS_URL
            - name: CENTRIFUGO_CLIENT_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: taranis-config
                  key: CENTRIFUGO_ALLOWED_ORIGINS
            - name: CENTRIFUGO_CLIENT_PROXY_CONNECT_HTTP_STATIC_HEADERS
              value: '{"X-Realtime-Proxy-Key":"$(CENTRIFUGO_CONNECT_PROXY_SECRET)"}'
          ports:
            - containerPort: 8000
              name: client
            - containerPort: 9000
              name: internal
          readinessProbe:
            httpGet:
              path: /health
              port: internal
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: internal
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 50m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ingress
  template:
    metadata:
      labels:
        app: ingress
        taranis.io/expose: "true"
    spec:
      restartPolicy: Always
      containers:
        - name: ingress
          image: ghcr.io/taranis-ai/taranis-ingress:latest
          imagePullPolicy: Always
          env:
            - name: NGINX_WORKERS
              value: "4"
            - name: NGINX_CONNECTIONS
              value: "16"
            - name: TARANIS_CORE_UPSTREAM
              value: core:8080
            - name: TARANIS_REALTIME_UPSTREAM
              value: centrifugo:8000
            - name: TARANIS_FRONTEND_UPSTREAM
              value: frontend:8080
            - name: TARANIS_BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: taranis-config
                  key: TARANIS_BASE_PATH
                  optional: true
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 90
            timeoutSeconds: 30
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 90
            timeoutSeconds: 30
            failureThreshold: 5
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: "1"
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      restartPolicy: Always
      containers:
        - name: collector
          image: ghcr.io/taranis-ai/taranis-worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: taranis-config
            - secretRef:
                name: taranis-redis-credentials
          env:
            - name: TARANIS_CORE_URL
              value: http://core:8080/api
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: taranis-secrets
                  key: API_KEY
            - name: WORKER_TYPES
              value: '["Collectors"]'
          readinessProbe:
            exec:
              command:
                - taranis-worker-healthcheck
                - --mode
                - worker
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - taranis-worker-healthcheck
                - --mode
                - worker
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: "2"
              memory: 6Gi
            requests:
              cpu: 100m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      restartPolicy: Always
      containers:
        - name: worker
          image: ghcr.io/taranis-ai/taranis-worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: taranis-config
            - secretRef:
                name: taranis-secrets
            - secretRef:
                name: taranis-redis-credentials
          env:
            - name: TARANIS_CORE_URL
              value: http://core:8080/api
            - name: WORKER_TYPES
              value: '["Presenters", "Publishers", "Bots", "Connectors", "Misc"]'
          readinessProbe:
            exec:
              command:
                - taranis-worker-healthcheck
                - --mode
                - worker
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - taranis-worker-healthcheck
                - --mode
                - worker
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: "4"
              memory: 6Gi
            requests:
              cpu: "1"
              memory: 512Mi
---
apiVersion: apps/v1
