{% extends "base.html" %}
{% block content %}
  <div class="p-8 space-y-6" data-testid="notification-center-page">
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div>
        <h1 class="text-2xl font-semibold text-base-content">{{ _("Notification Center") }}</h1>
        <p class="text-sm text-base-content/70">{{ _("Notifications from this browser session. They are not stored on the server.") }}</p>
      </div>
      <button type="button" class="btn btn-outline btn-sm" data-notification-center-clear>{{ _("Clear all") }}</button>
    </div>
    <div class="space-y-3" data-notification-center-list data-empty-message="{{ _('No notifications in this browser session.') }}"></div>
  </div>
{% endblock content %}
