{% macro admin_menu_badge(view, view_name) %}
  {% if view.get_admin_menu_badge %}
    {% set badge = view.get_admin_menu_badge() %}
    {% if badge > 0 and view.get_admin_menu_badge_route %}
      <div class="group badge badge-error badge-sm absolute right-3 top-1/2 z-10 -translate-y-1/2 gap-1">
        <span>{{ badge }}</span>
        <a href="{{ view.get_admin_menu_badge_route() }}"
           class="w-0 overflow-hidden rounded opacity-0 transition-all group-hover:w-3 group-hover:opacity-100 focus-visible:w-3 focus-visible:opacity-100 focus-visible:outline focus-visible:outline-1"
           aria-label="View {{ badge }} current {{ view_name }} errors"
           data-testid="admin-menu-{{ view_name }}-errors">{{ heroicon_outline("link", class="h-3 w-3") }}</a>
      </div>
    {% endif %}
  {% endif %}
{% endmacro %}
