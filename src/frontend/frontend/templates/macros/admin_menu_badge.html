{% macro admin_menu_badge(view, view_name) %}
  {% if view.get_admin_menu_badge %}
    {% set badge = view.get_admin_menu_badge() %}
    {% if badge > 0 and view.get_admin_menu_badge_route %}
      <a href="{{ view.get_admin_menu_badge_route() }}"
         class="group badge badge-error badge-sm absolute right-3 top-1/2 z-10 -translate-y-1/2 transition hover:scale-110 hover:brightness-90"
         aria-label="View {{ badge }} current {{ view_name }} errors"
         data-testid="admin-menu-{{ view_name }}-errors">
        <span class="group-hover:hidden group-focus-visible:hidden">{{ badge }}</span>
        <span class="hidden whitespace-nowrap group-hover:inline group-focus-visible:inline" aria-hidden="true">Show errors</span>
      </a>
    {% endif %}
  {% endif %}
{% endmacro %}
