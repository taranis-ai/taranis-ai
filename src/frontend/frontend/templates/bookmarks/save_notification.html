{% extends "notification/index.html" %}
{% block notification_actions %}
  <div class="flex flex-wrap items-center gap-2" @click.stop>
    <a href="{{ url_for('assess.bookmark', bookmark_id=bookmark.id) }}" class="btn btn-ghost btn-xs">Open collection</a>
    <a href="{{ url_for('assess.bookmark_story', story_id=story_id) }}"
       hx-get="{{ url_for('assess.bookmark_story', story_id=story_id) }}"
       hx-target="body"
       hx-swap="beforeend"
       class="btn btn-ghost btn-xs">Change</a>
    {% if can_undo %}
      <form method="post"
            action="{{ url_for('assess.submit_bookmark_story') }}"
            hx-post="{{ url_for('assess.submit_bookmark_story') }}"
            hx-target="#notification-bar"
            hx-swap="outerHTML">
        <input type="hidden" name="csrf_token" value="{{ request.cookies.get(config['JWT_ACCESS_CSRF_COOKIE_NAME'], '') }}">
        <input type="hidden" name="story_ids" value="{{ story_id }}">
        <input type="hidden" name="remove_bookmark_ids" value="{{ bookmark.id }}">
        <button type="submit" class="btn btn-ghost btn-xs" data-test-id="bookmark-undo">Undo</button>
      </form>
    {% endif %}
  </div>
{% endblock notification_actions %}
