{% if active_filters %}
  <nav aria-label="Active filters"
       class="flex min-w-0 max-w-full items-center gap-2 overflow-x-auto {{ 'lg:max-w-[40%]' if current_user.profile.show_bookmark_bar else 'flex-1' }}">
    {% for filter in active_filters %}
      <a href="{{ filter.url }}"
         class="badge badge-outline shrink-0 gap-2 h-auto py-1 max-w-full"
         aria-label="Remove {{ filter.label }}"
         hx-get="{{ filter.url }}"
         hx-headers='{"HX-Refresh-Sidebar":"true"}'
         hx-target="#assess"
         hx-swap="outerHTML"
         hx-push-url="true"
         hx-sync="#assess-sidebar:replace"
         hx-status:400="target:#notification-bar select:#notification-bar swap:outerHTML"
         hx-status:4xx="target:#notification-bar select:#notification-bar swap:outerHTML"
         hx-status:5xx="target:#notification-bar select:#notification-bar swap:outerHTML">
        <span class="truncate">{{ filter.label }}</span>{{ heroicon_mini('x-mark', class='h-3 w-3 shrink-0') }}
      </a>
    {% endfor %}
  </nav>
{% endif %}
