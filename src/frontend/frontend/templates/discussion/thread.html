{% extends "base.html" %}

{% block content %}
  <div class="mx-auto max-w-4xl px-4 py-6 sm:px-8">
    <a class="link link-hover text-sm" href="{{ url_for('discussion.overview', scope=discussion_scope) }}">← Discussion</a>
    <header class="my-4">
      {% if discussion.parent %}
        <p class="mb-1 text-sm font-medium text-base-content/70">{{ parent_label }}</p>
        <h1 class="text-2xl font-semibold [overflow-wrap:anywhere]">{{ discussion.parent.title or parent_label }}</h1>
        <a class="link link-hover mt-2 inline-block text-sm" href="{{ parent_url }}">Open {{ parent_label | lower }}</a>
      {% else %}
        <h1 class="text-2xl font-semibold">Discussion</h1>
      {% endif %}
    </header>
    {% include "discussion/section.html" %}
  </div>
{% endblock content %}
