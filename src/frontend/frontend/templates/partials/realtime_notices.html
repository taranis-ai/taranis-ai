<div id="realtime-status-notification" class="toast toast-start toast-bottom z-50 hidden" role="status" aria-live="polite">
  <div class="alert alert-warning flex items-center gap-3">
    <span>{{ _("Live updates are unavailable. Data may require a manual refresh.") }}</span>
    <button type="button" class="btn btn-ghost btn-sm" data-realtime-dismiss-status aria-label="{{ _('Dismiss realtime notification') }}">{{ _("Dismiss") }}</button>
  </div>
</div>

<div id="realtime-data-notification"
     class="toast toast-center toast-bottom z-50 hidden"
     role="status"
     aria-live="polite"
     data-default-message="{{ _('New data is available.') }}"
     data-assess-message="{{ _('New stories are available in Assess.') }}"
     data-default-action="{{ _('Refresh') }}"
     data-assess-action="{{ _('Load new stories') }}">
  <div class="alert alert-info flex items-center gap-3">
    <span data-realtime-data-message></span>
    <a class="btn btn-primary btn-sm" data-realtime-refresh href="{{ request.full_path }}"></a>
    <button type="button" class="btn btn-ghost btn-sm" data-realtime-dismiss-data aria-label="{{ _('Dismiss realtime notification') }}">{{ _("Dismiss") }}</button>
  </div>
</div>
