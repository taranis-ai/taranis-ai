{% if active_filter %}
  <div class="alert alert-info mb-3 flex items-center justify-between" role="status" data-testid="active-failure-filter">
    <span>{{ active_filter.label }}</span>
    <a href="{{ active_filter.clear_url }}"
       class="btn btn-ghost btn-sm"
       hx-get="{{ active_filter.clear_url }}"
       hx-target="#{{ table_container }}"
       hx-swap="outerHTML"
       hx-push-url="true"
       data-testid="clear-failure-filter">Show all</a>
  </div>
{% endif %}
